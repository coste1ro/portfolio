<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrey Beregovoy — Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    body.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link:hover { opacity: 0.4; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-bottom {
      margin-top: auto;
      padding-bottom: 40px;
    }

    .hero-subtitle {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      color: var(--fg);
      padding: 0 40px;
      margin-bottom: 20px;
    }

    .hero-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      padding: 0 40px;
      display: block;
    }

    /* ── Preloader ── */
    body.preloading { overflow: hidden; }
    nav, .hero-subtitle { transition: opacity 0.8s ease; }
    body.preloading nav,
    body.preloading .hero-subtitle { opacity: 0; }

    #preload {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9000;
      overflow: hidden;
      transition: background 0.8s ease;
    }
    #preload-count {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.08em;
      color: #000;
      transition: opacity 0.4s ease;
    }
    #preload-name {
      position: absolute;
      left: 0; top: 0;
      padding: 0 40px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: #000;
      transform: translateY(-50%);
    }
    #preload-name .pl-letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(-0.45em);
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

  <div id="preload">
    <span id="preload-name">ANDREY BEREGOVOY</span>
    <span id="preload-count">000</span>
  </div>

  <nav>
    <a href="index.html" class="nav-link">Index</a>
    <a href="cases.html" class="nav-link">Cases</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <section class="hero">
    <div class="hero-bottom">
      <p class="hero-subtitle">Дизайнер с фокусом на интерфейсах, которые ощущаются<br>правильно с первого взгляда</p>
      <span class="hero-name">ANDREY BEREGOVOY</span>
    </div>
  </section>

  <div id="cursor-outer"></div>

  <script>
    (function () {
      const preload  = document.getElementById('preload');
      const countEl  = document.getElementById('preload-count');
      const nameEl   = document.getElementById('preload-name');
      const realName = document.querySelector('.hero-name');
      const reduce   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      document.body.classList.add('preloading');

      if (reduce) {
        preload.remove();
        document.body.classList.remove('preloading');
        return;
      }

      const fullName = nameEl.textContent;
      const letters = fullName.split('').map(function (ch) {
        const s = document.createElement('span');
        s.className = 'pl-letter';
        s.textContent = ch === ' ' ? ' ' : ch;
        return s;
      });
      nameEl.textContent = '';
      letters.forEach(function (s) { nameEl.appendChild(s); });

      function reveal() {
        document.body.classList.remove('preloading');
        preload.style.background = 'transparent';
        preload.style.pointerEvents = 'none';
        setTimeout(function () { preload.remove(); }, 850);
      }

      function move() {
        nameEl.textContent = fullName;
        const cur = nameEl.getBoundingClientRect();
        const tgt = realName.getBoundingClientRect();
        const dx = tgt.left - cur.left;
        const dy = tgt.top  - cur.top;
        nameEl.style.transition = 'transform 1s cubic-bezier(0.76,0,0.24,1)';
        nameEl.style.transform = 'translateY(-50%) translate(' + dx + 'px,' + dy + 'px)';
        setTimeout(reveal, 1000);
      }

      function finish() {
        countEl.style.opacity = '0';
        setTimeout(move, 300);
      }

      function run() {
        const DURATION = 2200;
        const start = performance.now();
        let nameShown = false;
        (function frame(now) {
          const t = Math.min((now - start) / DURATION, 1);
          countEl.textContent = String(Math.round(t * 100)).padStart(3, '0');
          if (t >= 0.5 && !nameShown) {
            nameShown = true;
            letters.forEach(function (s, i) {
              setTimeout(function () {
                s.style.opacity = '1';
                s.style.transform = 'translateY(0)';
              }, i * 45);
            });
          }
          if (t < 1) requestAnimationFrame(frame);
          else finish();
        })(start);
      }

      if (document.fonts && document.fonts.ready) {
        Promise.race([
          document.fonts.ready,
          new Promise(function (r) { setTimeout(r, 1500); })
        ]).then(run);
      } else {
        run();
      }
    })();
  </script>

  <script>
    const ring = document.getElementById('cursor-outer');
    let mx = -100, my = -100, rx = -100, ry = -100;
    let scale = 1, scaleTarget = 1, placed = false;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (!placed) { placed = true; rx = mx; ry = my; ring.style.opacity = '1'; }
    });
    document.addEventListener('mousedown', () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',   () => { scaleTarget = 1; });
    (function loop() {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      scale += (scaleTarget - scale) * 0.2;
      ring.style.transform = 'translate3d(' + (rx - 12) + 'px,' + (ry - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
      requestAnimationFrame(loop);
    })();
  </script>

</body>
</html>
