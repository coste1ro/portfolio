<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon-dark.png">
  <link rel="apple-touch-icon" href="favicon-dark.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrey Beregovoy&nbsp;— Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&family=Roboto+Mono:wght@200&display=swap" rel="stylesheet">
  <script>
    try { if (localStorage.getItem('bvg_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <script>
    window.__bvgInternal = false;
    (function () {
      var entry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var navType = entry ? entry.type : 'navigate';
      var internal = false;
      try { internal = sessionStorage.getItem('bvg_nav') === '1'; sessionStorage.removeItem('bvg_nav'); } catch (e) {}
      if (internal && navType !== 'reload' && navType !== 'back_forward') {
        window.__bvgInternal = true;
        document.documentElement.classList.add('entering');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    html.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link::before,
    .nav-link::after,
    .theme-switch button::before,
    .theme-switch button::after {
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .nav-link::before,
    .theme-switch button::before { content: '['; margin-right: 2px; }
    .nav-link::after,
    .theme-switch button::after  { content: ']'; margin-left: 2px; }
    .nav-link:hover::before,
    .nav-link:hover::after,
    .theme-switch button:hover::before,
    .theme-switch button:hover::after { opacity: 1; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-bottom {
      margin-top: auto;
      padding-bottom: 40px;
    }

    .hero-subtitle {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      color: var(--fg);
      padding: 0 40px;
      margin-bottom: 20px;
    }

    .hero-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      padding: 0 40px;
      display: block;
      font-kerning: none;
    }

    /* ── Preloader ── */
    nav { transition: opacity 0.35s ease; }
    .hero-subtitle { transition: opacity 0.8s ease; }
    body.preloading nav,
    body.preloading .hero-subtitle { opacity: 0; }

    #preload {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9000;
      overflow: hidden;
      transition: background 0.8s ease;
    }
    #preload-count {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Roboto Mono', monospace;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #preload-name {
      position: absolute;
      left: 0; top: 0;
      padding: 0 40px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      transform: translateY(-50%);
      font-kerning: none;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── Theme switch ── */
    .theme-switch {
      position: fixed;
      top: 80px;
      right: 40px;
      z-index: 100;
      display: flex;
      gap: 12px;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      color: var(--fg);
      transition: opacity 0.35s ease;
    }
    .theme-switch button {
      background: none;
      border: 0;
      padding: 0;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: inherit;
      transition: opacity 0.2s ease;
    }
    body.preloading .theme-switch { opacity: 0; }

    /* ── Mobile header wrapper (no-op — nav/theme stay top-right like
       every other page, this is just the pre-existing DOM grouping). ── */
    .mobile-header { display: contents; }

    /* ── Internal navigation intro ── */
    .hero { transition: opacity 0.35s ease; }
    html.entering .hero { opacity: 0; }
    html.no-motion nav,
    html.no-motion .hero,
    html.no-motion .theme-switch { transition: none !important; }

    /* ── Mobile: hero name wraps to 2 lines (first/last name), left-
       aligned, pinned a fixed 24px from the true viewport bottom —
       NOT via flex margin-top:auto, which silently let a taller 2-line
       name push .hero past 100vh and get clipped by body's
       overflow:hidden (only "Andrey" stayed visible). Subtitle is a
       separate fixed block centered on the screen, independent of the
       name's height. ── */
    @media (max-width: 900px) {
      .hero-subtitle {
        position: fixed; top: 50%; left: 24px; right: 24px; transform: translateY(-50%);
        width: 50%; margin: 0 auto; padding: 0; text-align: center;
      }
      .hero-name {
        position: fixed; left: 0; right: 0; bottom: 24px;
      }
      .hero-name, #preload-name {
        white-space: normal; text-align: left; padding: 0 24px;
      }
      /* Each word its own block, both flush against the same left edge —
         guarantees they line up under each other instead of relying on
         where the browser happens to wrap a single text run. width:
         fit-content so the box (and getBoundingClientRect measurement in
         fitName) shrink-wraps the text instead of stretching to the full
         line width. letter-spacing redeclared here (not just inherited)
         so the em value resolves against each word's own — independently
         fit — font-size. */
      .hero-name .word, #preload-name .word {
        display: block; width: fit-content; letter-spacing: 0.03em;
      }
      /* Small optical correction: a pointed capital ("A") reads as sitting
         further left than a flat-stemmed one ("B") directly below it even
         when both boxes start at the same x. Nudge the first line in to
         compensate. */
      .hero-name .word:first-child, #preload-name .word:first-child {
        margin-left: 0.02em;
      }
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

  <div id="preload">
    <span id="preload-name"><span class="word">ANDREY</span> <span class="word">BEREGOVOY</span></span>
    <span id="preload-count">000</span>
  </div>

  <div class="mobile-header">
    <nav>
      <a href="index.html" class="nav-link">Index</a>
      <a href="cases.html" class="nav-link">Cases</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>

    <div class="theme-switch">
      <button type="button" data-theme="light">LIGHT</button>
      <span aria-hidden="true">|</span>
      <button type="button" data-theme="dark">DARK</button>
    </div>
  </div>

  <section class="hero">
    <div class="hero-bottom">
      <p class="hero-subtitle">Дизайнер с&nbsp;фокусом на&nbsp;интерфейсах, которые ощущаются<br>правильно с&nbsp;первого взгляда</p>
      <span class="hero-name"><span class="word">ANDREY</span> <span class="word">BEREGOVOY</span></span>
    </div>
  </section>

  <div id="cursor-outer"></div>

  <script>
    (function () {
      const preload  = document.getElementById('preload');
      const countEl  = document.getElementById('preload-count');
      const nameEl   = document.getElementById('preload-name');
      const realName = document.querySelector('.hero-name');
      const navEl    = document.querySelector('nav');
      const subEl    = document.querySelector('.hero-subtitle');
      const switchEl = document.querySelector('.theme-switch');
      const reduce   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Size the name so its text fills the viewport width minus margin each
      // side. On mobile the name splits into two lines (first/last name),
      // each independently stretched to fill the full width.
      function fitName(el) {
        const mobile = document.documentElement.clientWidth <= 900;
        const words = el.querySelectorAll('.word');
        if (mobile && words.length) {
          // Each line independently stretched edge-to-edge — name and
          // surname get their own font-size rather than sharing one sized
          // to whichever word is wider.
          const avail = document.documentElement.clientWidth - 48;
          words.forEach(function (word) {
            word.style.fontSize = '200px';
            const w = word.getBoundingClientRect().width;
            if (w > 0) word.style.fontSize = (200 * avail / w) + 'px';
          });
          return;
        }
        el.style.fontSize = '200px';
        const range = document.createRange();
        range.selectNodeContents(el);
        const w = range.getBoundingClientRect().width;
        if (w > 0) el.style.fontSize = (200 * (document.documentElement.clientWidth - 80) / w) + 'px';
      }
      window.addEventListener('resize', function () { fitName(realName); });

      // Copies fitted sizing from the real name onto the #preload-name
      // clone. On mobile each word carries its own independent font-size
      // (not the wrapping element), so copy per word instead of once.
      function copyNameSize(from, to) {
        const fromWords = from.querySelectorAll('.word');
        const toWords = to.querySelectorAll('.word');
        if (fromWords.length && toWords.length) {
          fromWords.forEach(function (w, i) { if (toWords[i]) toWords[i].style.fontSize = w.style.fontSize; });
          return;
        }
        to.style.fontSize = from.style.fontSize;
      }

      // Internal nav between INDEX — CASES — ABOUT dissolves the current
      // screen out; the destination page plays a fast version of the entry
      // intro (name slides into place, no counter). The full intro with
      // counter only plays on a real entry (external link or reload).
      function currentFile() {
        const p = location.pathname.split('/').pop();
        return (p === '' ? 'index.html' : p).replace(/\.html$/, '');
      }
      let navBusy = false;
      (function bindNavTransition() {
        const here = currentFile();
        const mainEl = document.querySelector('.hero');
        document.querySelectorAll('nav a').forEach(function (a) {
          const href = a.getAttribute('href');
          if (href.replace(/\.html$/, '') === here) {
            a.addEventListener('click', function (e) { e.preventDefault(); });
            return;
          }
          a.addEventListener('click', function (e) {
            e.preventDefault();
            if (navBusy) return;
            navBusy = true;
            try { sessionStorage.setItem('bvg_nav', '1'); } catch (err) {}
            if (reduce) { window.location.href = href; return; }
            // Only the page content fades — nav and the theme switch stay
            // put throughout the whole transition.
            mainEl.style.transition = 'opacity 0.35s ease';
            mainEl.style.opacity = '0';
            setTimeout(function () { window.location.href = href; }, 350);
          });
        });
      })();

      function clearEnterState() {
        const html = document.documentElement;
        if (!html.classList.contains('entering')) return;
        html.classList.add('no-motion');
        html.classList.remove('entering');
      }

      function shouldPreload() {
        return !window.__bvgInternal;
      }

      const canShow = shouldPreload();

      if (reduce) {
        fitName(realName);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { fitName(realName); });
        }
        preload.remove();
        clearEnterState();
        return;
      }

      document.body.classList.add('preloading');
      realName.style.opacity = '0';

      function reveal() {
        navEl.style.opacity = '1';
        subEl.style.opacity = '1';
        realName.style.opacity = '1';
        if (switchEl) switchEl.style.opacity = '1';
        document.body.classList.remove('preloading');
        preload.remove();
      }

      function move() {
        preload.style.background = 'transparent';
        preload.style.pointerEvents = 'none';

        const cur = nameEl.getBoundingClientRect();
        const tgt = realName.getBoundingClientRect();
        const dx = tgt.left - cur.left;
        const dy = tgt.top  - cur.top;
        nameEl.style.transition = 'transform 1s cubic-bezier(0.76,0,0.24,1)';
        nameEl.style.transform = 'translateY(-50%) translate(' + dx + 'px,' + dy + 'px)';

        // Reveal each element as the descending name sweeps past its position.
        const navLine = navEl.getBoundingClientRect().bottom;
        const subLine = subEl.getBoundingClientRect().top;
        let navShown = false, subShown = false, moving = true;
        (function pass() {
          const top = nameEl.getBoundingClientRect().top;
          if (!navShown && top >= navLine) { navShown = true; navEl.style.opacity = '1'; if (switchEl) switchEl.style.opacity = '1'; }
          if (!subShown && top >= subLine) { subShown = true; subEl.style.opacity = '1'; }
          if (moving) requestAnimationFrame(pass);
        })();

        setTimeout(function () { moving = false; reveal(); }, 1000);
      }

      function finish() {
        countEl.style.opacity = '0';
        setTimeout(move, 300);
      }

      function run() {
        countEl.style.opacity = '1';
        const DURATION = 2200;
        const start = performance.now();
        let nameShown = false;
        (function frame(now) {
          const t = Math.min((now - start) / DURATION, 1);
          countEl.textContent = String(Math.round(t * 100)).padStart(3, '0');
          if (t >= 0.5 && !nameShown) {
            nameShown = true;
            nameEl.style.clipPath = 'inset(0 0% 0 0)';
          }
          if (t < 1) requestAnimationFrame(frame);
          else finish();
        })(start);
      }

      function begin() {
        fitName(realName);
        copyNameSize(realName, nameEl);
        run();
      }

      if (!canShow) {
        // Internal nav: nav and the theme switch never hide, they're shown
        // right away. Skip the counter, show the name already fully formed
        // at its half-visible top position, then run the same
        // slide-into-place used by the full intro — so there's motion on
        // screen from the first frame instead of a blank gap before the
        // page dissolves in.
        clearEnterState();
        navEl.style.opacity = '1';
        if (switchEl) switchEl.style.opacity = '1';
        fitName(realName);
        copyNameSize(realName, nameEl);
        countEl.remove();
        nameEl.style.transition = 'none';
        nameEl.style.clipPath = 'inset(0 0% 0 0)';
        requestAnimationFrame(move);
        return;
      }

      if (document.fonts && document.fonts.ready) {
        Promise.race([
          document.fonts.ready,
          new Promise(function (r) { setTimeout(r, 1500); })
        ]).then(begin);
      } else {
        begin();
      }
    })();
  </script>

  <script>
    (function () {
      const root = document.documentElement;
      const btns = document.querySelectorAll('.theme-switch button');
      function sync() {
        const dark = root.classList.contains('dark');
        btns.forEach(function (b) { b.classList.toggle('active', (b.dataset.theme === 'dark') === dark); });
      }
      sync();
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          const dark = b.dataset.theme === 'dark';
          root.classList.toggle('dark', dark);
          try { localStorage.setItem('bvg_theme', dark ? 'dark' : 'light'); } catch (e) {}
          sync();
        });
      });
    })();
  </script>

  <script>
    const ring = document.getElementById('cursor-outer');
    let mx = -100, my = -100;
    let scale = 1, scaleTarget = 1, placed = false;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (!placed) { placed = true; ring.style.opacity = '1'; }
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
    });
    document.addEventListener('mousedown', () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',   () => { scaleTarget = 1; });
    (function loop() {
      scale += (scaleTarget - scale) * 0.2;
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
      requestAnimationFrame(loop);
    })();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
