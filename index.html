<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrey Beregovoy — Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    body.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1440px;
      display: flex;
      justify-content: flex-end;
      padding-right: 40px;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link:hover { opacity: 0.4; }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .hero-bottom {
      margin-top: auto;
      padding-bottom: 40px;
    }

    .hero-subtitle {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      color: var(--fg);
      padding: 0 40px;
      margin-bottom: 20px;
    }

    .hero-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(60px, 8.2vw, 118px);
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      padding: 0 40px;
      display: block;
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      transition: width 0.45s cubic-bezier(0.16,1,0.3,1),
                  height 0.45s cubic-bezier(0.16,1,0.3,1);
    }
  </style>
</head>
<body>

  <nav>
    <a href="cases.html" class="nav-link">Cases</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <section class="hero">
    <div class="hero-bottom">
      <p class="hero-subtitle">Дизайнер с фокусом на интерфейсах, которые ощущаются<br>правильно с первого взгляда</p>
      <span class="hero-name">ANDREY BEREGOVOY</span>
    </div>
  </section>

  <div id="cursor-outer"></div>
  <div id="cursor-dot" style="position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;z-index:99999;will-change:transform;mix-blend-mode:difference;"></div>

  <script>
    const ring = document.getElementById('cursor-outer');
    const dot  = document.getElementById('cursor-dot');
    let mx = -100, my = -100, rx = -100, ry = -100;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = 'translate3d(' + (mx - 4) + 'px,' + (my - 4) + 'px,0)';
    });
    (function loop() {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      ring.style.transform = 'translate3d(' + (rx - 9) + 'px,' + (ry - 9) + 'px,0)';
      requestAnimationFrame(loop);
    })();
  </script>

</body>
</html>
