<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases — Andrey Beregovoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&family=Roboto+Mono:wght@200&display=swap" rel="stylesheet">
  <script>
    window.__bvgInternal = false;
    (function () {
      var entry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var navType = entry ? entry.type : 'navigate';
      var internal = false;
      try { internal = sessionStorage.getItem('bvg_nav') === '1'; sessionStorage.removeItem('bvg_nav'); } catch (e) {}
      if (internal && navType !== 'reload' && navType !== 'back_forward') {
        window.__bvgInternal = true;
        document.documentElement.classList.add('entering');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    body.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link::before,
    .nav-link::after {
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .nav-link::before { content: '['; margin-right: 2px; }
    .nav-link::after  { content: ']'; margin-left: 2px; }
    .nav-link:hover::before,
    .nav-link:hover::after { opacity: 1; }

    /* ── Page ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--fg);
      font-kerning: none;
    }

    /* ── Cases track ── */
    .cases-viewport {
      margin-top: auto;
      overflow: hidden;
      padding-top: 100px;
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.6s ease;
    }
    .cases-track {
      display: flex;
      gap: 40px;
      will-change: transform;
    }

    .case-item {
      flex: 0 0 560px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .case-item:hover {
      transform: translateY(-25%);
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .case-num {
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      color: var(--fg);
      display: block;
      padding-bottom: 12px;
    }

    .case-img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }

    .case-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    /* ── Preloader ── */
    nav { transition: opacity 0.35s ease; }
    body.preloading nav { opacity: 0; }
    body.preloading .cases-viewport { opacity: 0; transform: translateY(80px); }
    body.preloading.revealing nav { opacity: 1; }
    body.preloading.revealing .cases-viewport { opacity: 1; transform: translateY(0); }

    /* ── Internal navigation dissolve ── */
    .page { transition: opacity 0.35s ease; }
    html.entering nav,
    html.entering .page { opacity: 0; }
    html.no-motion nav,
    html.no-motion .page { transition: none !important; }
    html.entering #preload { display: none; }

    #preload {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9000;
      overflow: hidden;
      transition: background 0.6s ease;
    }
    #preload-count {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Roboto Mono', monospace;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: #000;
      transition: opacity 0.4s ease;
    }
    #preload-title {
      position: absolute;
      left: 40px; bottom: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: #000;
      transform: translateY(50%);
      font-kerning: none;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

  <div id="preload">
    <span id="preload-title">Cases</span>
    <span id="preload-count">000</span>
  </div>

  <nav>
    <a href="index.html" class="nav-link">Index</a>
    <a href="cases.html" class="nav-link">Cases</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <main class="page">
    <h1 class="page-title">Cases</h1>

    <div class="cases-viewport">
      <div class="cases-track">

        <a href="rutube.html" class="case-item">
          <span class="case-num">[1]</span>
          <div class="case-img">
            <img src="projects/rutube.png" alt="Rutube — Редизайн подписки">
          </div>
        </a>

        <a href="auditors_monitoring.html" class="case-item">
          <span class="case-num">[2]</span>
          <div class="case-img">
            <img src="projects/auditors_monitoring.png" alt="Мониторинг аудиторов">
          </div>
        </a>

        <a href="installation_panel.html" class="case-item">
          <span class="case-num">[3]</span>
          <div class="case-img">
            <img src="projects/installation_panel.png" alt="Панель инсталляций">
          </div>
        </a>

      </div>
    </div>
  </main>

  <div id="cursor-outer"></div>

  <script>
    (function () {
      const preload   = document.getElementById('preload');
      const countEl   = document.getElementById('preload-count');
      const titleEl   = document.getElementById('preload-title');
      const realTitle = document.querySelector('.page-title');
      const navEl     = document.querySelector('nav');
      const reduce    = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Internal nav between INDEX — CASES — ABOUT dissolves the current
      // screen out, then the destination page dissolves in. The entry intro
      // only plays on a real entry (external link or reload).
      function currentFile() {
        const p = location.pathname.split('/').pop();
        return (p === '' ? 'index.html' : p).replace(/\.html$/, '');
      }
      let navBusy = false;
      (function bindNavTransition() {
        const here = currentFile();
        const mainEl = document.querySelector('.page');
        document.querySelectorAll('nav a').forEach(function (a) {
          const href = a.getAttribute('href');
          if (href.replace(/\.html$/, '') === here) {
            a.addEventListener('click', function (e) { e.preventDefault(); });
            return;
          }
          a.addEventListener('click', function (e) {
            e.preventDefault();
            if (navBusy) return;
            navBusy = true;
            try { sessionStorage.setItem('bvg_nav', '1'); } catch (err) {}
            if (reduce) { window.location.href = href; return; }
            navEl.style.transition = 'opacity 0.35s ease';
            mainEl.style.transition = 'opacity 0.35s ease';
            navEl.style.opacity = '0';
            mainEl.style.opacity = '0';
            setTimeout(function () { window.location.href = href; }, 350);
          });
        });
      })();

      function clearEnterState(instant) {
        const html = document.documentElement;
        if (!html.classList.contains('entering')) return;
        if (instant) {
          html.classList.add('no-motion');
          html.classList.remove('entering');
          return;
        }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            html.classList.remove('entering');
          });
        });
      }

      function shouldPreload() {
        return !window.__bvgInternal;
      }

      const canShow = shouldPreload();

      if (reduce || !canShow) {
        preload.remove();
        clearEnterState(reduce);
        return;
      }

      document.body.classList.add('preloading');
      realTitle.style.opacity = '0';

      function reveal() {
        navEl.style.opacity = '1';
        realTitle.style.opacity = '1';
        titleEl.style.opacity = '0';
        document.body.classList.add('revealing');
        setTimeout(function () {
          document.body.classList.remove('preloading');
          document.body.classList.remove('revealing');
          preload.remove();
        }, 700);
      }

      function move() {
        preload.style.background = 'transparent';
        preload.style.pointerEvents = 'none';

        const cur = titleEl.getBoundingClientRect();
        const tgt = realTitle.getBoundingClientRect();
        const dx = tgt.left - cur.left;
        const dy = tgt.top  - cur.top;
        titleEl.style.transition = 'transform 1s cubic-bezier(0.76,0,0.24,1)';
        titleEl.style.transform = 'translateY(50%) translate(' + dx + 'px,' + dy + 'px)';

        // Reveal nav once the ascending title sweeps past its position.
        const navLine = navEl.getBoundingClientRect().bottom;
        let navShown = false, moving = true;
        (function pass() {
          const top = titleEl.getBoundingClientRect().top;
          if (!navShown && top <= navLine) { navShown = true; navEl.style.opacity = '1'; }
          if (moving) requestAnimationFrame(pass);
        })();

        setTimeout(function () { moving = false; reveal(); }, 1000);
      }

      function finish() {
        countEl.style.opacity = '0';
        setTimeout(move, 300);
      }

      function run() {
        const DURATION = 2200;
        const start = performance.now();
        let titleShown = false;
        (function frame(now) {
          const t = Math.min((now - start) / DURATION, 1);
          countEl.textContent = String(Math.round(t * 100)).padStart(3, '0');
          if (t >= 0.5 && !titleShown) {
            titleShown = true;
            titleEl.style.clipPath = 'inset(0 0% 0 0)';
          }
          if (t < 1) requestAnimationFrame(frame);
          else finish();
        })(start);
      }

      if (document.fonts && document.fonts.ready) {
        Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(run);
      } else {
        run();
      }
    })();
  </script>

  <script>
    const track = document.querySelector('.cases-track');
    const originalItems = Array.from(track.children);
    originalItems.forEach(function (item) { track.appendChild(item.cloneNode(true)); });

    const ITEM_W = 560, GAP = 40;
    const setWidth = originalItems.length * (ITEM_W + GAP);

    let offset = 0;
    document.addEventListener('wheel', function (e) {
      offset += e.deltaY;
      const wrapped = ((offset % setWidth) + setWidth) % setWidth;
      track.style.transform = 'translateX(' + (-wrapped) + 'px)';
    }, { passive: true });
  </script>

  <script>
    const ring = document.getElementById('cursor-outer');
    let mx = -100, my = -100;
    let scale = 1, scaleTarget = 1, placed = false;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (!placed) { placed = true; ring.style.opacity = '1'; }
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
    });
    document.addEventListener('mousedown', () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',   () => { scaleTarget = 1; });
    (function loop() {
      scale += (scaleTarget - scale) * 0.2;
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
      requestAnimationFrame(loop);
    })();
  </script>

</body>
</html>
