<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases — Andrey Beregovoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    body.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link:hover { opacity: 0.4; }

    /* ── Page ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--fg);
    }

    /* ── Cases grid ── */
    .cases-grid {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    .case-item {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .case-num {
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      color: var(--fg);
      display: block;
      padding-bottom: 12px;
    }

    .case-img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }

    .case-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .case-item:hover .case-img img { transform: scale(1.03); }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
    }
    #cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
    }
    body.dark #cursor-outer { border-color: rgba(255,255,255,0.3); }
    body.dark #cursor-dot   { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-link">Index</a>
    <a href="cases.html" class="nav-link">Cases</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <main class="page">
    <h1 class="page-title">Cases</h1>

    <div class="cases-grid">

      <a href="rutube.html" class="case-item">
        <span class="case-num">[1]</span>
        <div class="case-img">
          <img src="projects/rutube.png" alt="Rutube — Редизайн подписки">
        </div>
      </a>

      <a href="auditors_monitoring.html" class="case-item">
        <span class="case-num">[2]</span>
        <div class="case-img">
          <img src="projects/auditors_monitoring.png" alt="Мониторинг аудиторов">
        </div>
      </a>

      <a href="installation_panel.html" class="case-item">
        <span class="case-num">[3]</span>
        <div class="case-img">
          <img src="projects/installation_panel.png" alt="Панель инсталляций">
        </div>
      </a>

    </div>
  </main>

  <div id="cursor-outer"></div>
  <div id="cursor-dot"></div>

  <script>
    const ring = document.getElementById('cursor-outer');
    const dot  = document.getElementById('cursor-dot');
    let mx = -100, my = -100, rx = -100, ry = -100;
    let scale = 1, scaleTarget = 1;
    const MAX_DIST = 12.5;
    document.addEventListener('mousemove',  e => { mx = e.clientX; my = e.clientY; });
    document.addEventListener('mousedown',  () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',    () => { scaleTarget = 1; });
    (function loop() {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      scale += (scaleTarget - scale) * 0.2;
      const dx = mx - rx, dy = my - ry;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const cx = dist > MAX_DIST ? rx + dx / dist * MAX_DIST : mx;
      const cy = dist > MAX_DIST ? ry + dy / dist * MAX_DIST : my;
      ring.style.transform = 'translate3d(' + (rx - 18) + 'px,' + (ry - 18) + 'px,0) scale(' + scale.toFixed(3) + ')';
      dot.style.transform  = 'translate3d(' + (cx - 4)  + 'px,' + (cy - 4)  + 'px,0)';
      requestAnimationFrame(loop);
    })();
  </script>

</body>
</html>
