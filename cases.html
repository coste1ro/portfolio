<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon-dark.png">
  <link rel="apple-touch-icon" href="favicon-dark.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases&nbsp;— Andrey Beregovoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&family=Roboto+Mono:wght@200&display=swap" rel="stylesheet">
  <script>
    try { if (localStorage.getItem('bvg_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <script>
    window.__bvgInternal = false;
    (function () {
      var entry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var navType = entry ? entry.type : 'navigate';
      var internal = false;
      try { internal = sessionStorage.getItem('bvg_nav') === '1'; sessionStorage.removeItem('bvg_nav'); } catch (e) {}
      if (internal && navType !== 'reload' && navType !== 'back_forward') {
        window.__bvgInternal = true;
        document.documentElement.classList.add('entering');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    html.dark {
      --bg: #0c0c0c;
      --fg: #f0f0f0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link::before,
    .nav-link::after,
    .theme-switch button::before,
    .theme-switch button::after {
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .nav-link::before,
    .theme-switch button::before { content: '['; margin-right: 2px; }
    .nav-link::after,
    .theme-switch button::after  { content: ']'; margin-left: 2px; }
    .nav-link:hover::before,
    .nav-link:hover::after,
    .theme-switch button:hover::before,
    .theme-switch button:hover::after { opacity: 1; }

    /* ── Theme switch ── */
    .theme-switch {
      position: fixed;
      top: 80px;
      right: 40px;
      z-index: 100;
      display: flex;
      gap: 12px;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      color: var(--fg);
      transition: opacity 0.35s ease;
    }
    .theme-switch button {
      background: none;
      border: 0;
      padding: 0;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      color: inherit;
      transition: opacity 0.2s ease;
    }
    body.preloading .theme-switch { opacity: 0; }

    /* ── Page ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--fg);
      font-kerning: none;
    }

    /* ── Cases track ── */
    .cases-viewport {
      margin-top: auto;
      overflow: hidden;
      padding-top: 100px;
      transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1), opacity 1s ease;
    }
    .cases-track {
      display: flex;
      gap: 40px;
      will-change: transform;
    }

    .case-item {
      flex: 0 0 560px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: transform 0.4s ease;
    }
    .case-item:hover { transform: translateY(-12%); }

    .case-num {
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      color: var(--fg);
      display: block;
      padding-bottom: 40px;
    }

    .case-img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }

    .case-img picture { display: block; width: 100%; height: 100%; }
    .case-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    /* ── Preloader ── */
    nav { transition: opacity 0.35s ease; }
    body.preloading nav { opacity: 0; }
    body.preloading .cases-viewport { opacity: 0; transform: translateY(80px); }
    body.preloading.revealing .cases-viewport { opacity: 1; transform: translateY(0); }

    /* ── Internal navigation intro ── */
    .page { transition: opacity 0.35s ease; }
    html.entering nav,
    html.entering .page,
    html.entering .theme-switch { opacity: 0; }
    html.no-motion nav,
    html.no-motion .page,
    html.no-motion .theme-switch { transition: none !important; }

    #preload {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9000;
      overflow: hidden;
      transition: background 0.6s ease;
    }
    #preload-count {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Roboto Mono', monospace;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #preload-title {
      position: absolute;
      left: 40px; bottom: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: 8.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      transform: translateY(50%);
      font-kerning: none;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

  <div id="preload">
    <span id="preload-title">Cases</span>
    <span id="preload-count">000</span>
  </div>

  <nav>
    <a href="index.html" class="nav-link">Index</a>
    <a href="cases.html" class="nav-link">Cases</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <div class="theme-switch">
    <button type="button" data-theme="light">LIGHT</button>
    <span aria-hidden="true">|</span>
    <button type="button" data-theme="dark">DARK</button>
  </div>

  <main class="page">
    <h1 class="page-title">Cases</h1>

    <div class="cases-viewport">
      <div class="cases-track">

        <a href="rutube.html" class="case-item">
          <span class="case-num">[1]</span>
          <div class="case-img">
            <picture>
              <source srcset="projects/rutube.webp" type="image/webp">
              <img src="projects/rutube.png" alt="Rutube — Редизайн подписки" loading="eager" decoding="async">
            </picture>
          </div>
        </a>

        <a href="auditors_monitoring.html" class="case-item">
          <span class="case-num">[2]</span>
          <div class="case-img">
            <picture>
              <source srcset="projects/auditors_monitoring.webp" type="image/webp">
              <img src="projects/auditors_monitoring.png" alt="Мониторинг аудиторов" loading="eager" decoding="async">
            </picture>
          </div>
        </a>

        <a href="installation_panel.html" class="case-item">
          <span class="case-num">[3]</span>
          <div class="case-img">
            <picture>
              <source srcset="projects/installation_panel.webp" type="image/webp">
              <img src="projects/installation_panel.png" alt="Панель инсталляций" loading="eager" decoding="async">
            </picture>
          </div>
        </a>

      </div>
    </div>
  </main>

  <div id="cursor-outer"></div>

  <script>
    (function () {
      const preload   = document.getElementById('preload');
      const countEl   = document.getElementById('preload-count');
      const titleEl   = document.getElementById('preload-title');
      const realTitle = document.querySelector('.page-title');
      const navEl     = document.querySelector('nav');
      const switchEl  = document.querySelector('.theme-switch');
      const reduce    = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Internal nav between INDEX — CASES — ABOUT dissolves the current
      // screen out; the destination page plays a fast version of the entry
      // intro (title slides up into place, no counter). The full intro with
      // counter only plays on a real entry (external link or reload).
      function currentFile() {
        const p = location.pathname.split('/').pop();
        return (p === '' ? 'index.html' : p).replace(/\.html$/, '');
      }
      let navBusy = false;
      (function bindNavTransition() {
        const here = currentFile();
        const mainEl = document.querySelector('.page');
        document.querySelectorAll('nav a').forEach(function (a) {
          const href = a.getAttribute('href');
          if (href.replace(/\.html$/, '') === here) {
            a.addEventListener('click', function (e) { e.preventDefault(); });
            return;
          }
          a.addEventListener('click', function (e) {
            e.preventDefault();
            if (navBusy) return;
            navBusy = true;
            try { sessionStorage.setItem('bvg_nav', '1'); } catch (err) {}
            if (reduce) { window.location.href = href; return; }
            // Only the page content fades — nav and the theme switch stay
            // put throughout the whole transition.
            mainEl.style.transition = 'opacity 0.35s ease';
            mainEl.style.opacity = '0';
            setTimeout(function () { window.location.href = href; }, 350);
          });
        });
      })();

      function clearEnterState() {
        const html = document.documentElement;
        if (!html.classList.contains('entering')) return;
        html.classList.add('no-motion');
        html.classList.remove('entering');
      }

      function shouldPreload() {
        return !window.__bvgInternal;
      }

      const canShow = shouldPreload();

      if (reduce) {
        preload.remove();
        clearEnterState();
        return;
      }

      document.body.classList.add('preloading');
      realTitle.style.opacity = '0';

      function reveal() {
        navEl.style.opacity = '1';
        realTitle.style.opacity = '1';
        titleEl.style.opacity = '0';
        if (switchEl) switchEl.style.opacity = '1';
        setTimeout(function () {
          document.body.classList.remove('preloading');
          document.body.classList.remove('revealing');
          preload.remove();
        }, 700);
      }

      function move() {
        preload.style.background = 'transparent';
        preload.style.pointerEvents = 'none';

        const cur = titleEl.getBoundingClientRect();
        const tgt = realTitle.getBoundingClientRect();
        const dx = tgt.left - cur.left;
        const dy = tgt.top  - cur.top;
        titleEl.style.transition = 'transform 1s cubic-bezier(0.76,0,0.24,1)';
        titleEl.style.transform = 'translateY(50%) translate(' + dx + 'px,' + dy + 'px)';

        // Content rises together with the title, not delayed after it.
        document.body.classList.add('revealing');

        // Reveal nav once the ascending title sweeps past its position.
        const navLine = navEl.getBoundingClientRect().bottom;
        let navShown = false, moving = true;
        (function pass() {
          const top = titleEl.getBoundingClientRect().top;
          if (!navShown && top <= navLine) { navShown = true; navEl.style.opacity = '1'; if (switchEl) switchEl.style.opacity = '1'; }
          if (moving) requestAnimationFrame(pass);
        })();

        setTimeout(function () { moving = false; reveal(); }, 1000);
      }

      function finish() {
        countEl.style.opacity = '0';
        setTimeout(move, 300);
      }

      function run() {
        countEl.style.opacity = '1';
        const DURATION = 2200;
        const start = performance.now();
        let titleShown = false;
        (function frame(now) {
          const t = Math.min((now - start) / DURATION, 1);
          countEl.textContent = String(Math.round(t * 100)).padStart(3, '0');
          if (t >= 0.5 && !titleShown) {
            titleShown = true;
            titleEl.style.clipPath = 'inset(0 0% 0 0)';
          }
          if (t < 1) requestAnimationFrame(frame);
          else finish();
        })(start);
      }

      if (!canShow) {
        // Internal nav: nav and the theme switch never hide, they're shown
        // right away. Skip the counter, show the title already fully formed
        // at its half-visible bottom position, then run the same
        // slide-into-place used by the full intro — so there's motion on
        // screen from the first frame instead of a blank gap before the
        // page dissolves in.
        clearEnterState();
        navEl.style.opacity = '1';
        if (switchEl) switchEl.style.opacity = '1';
        countEl.remove();
        titleEl.style.transition = 'none';
        titleEl.style.clipPath = 'inset(0 0% 0 0)';
        requestAnimationFrame(move);
        return;
      }

      if (document.fonts && document.fonts.ready) {
        Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(run);
      } else {
        run();
      }
    })();
  </script>

  <script>
    const viewport = document.querySelector('.cases-viewport');
    const track = document.querySelector('.cases-track');
    const items = Array.from(track.children);
    const GAP = 40, VISIBLE = 2.3;   // 2 full cases + ~30% of the third peeking
    let offset = 0;

    function apply() {
      const max = Math.max(0, track.scrollWidth - viewport.clientWidth);
      offset = Math.max(0, Math.min(offset, max));
      track.style.transform = 'translateX(' + (-offset) + 'px)';
    }
    function layout() {
      const w = (viewport.clientWidth - GAP * 2) / VISIBLE;
      items.forEach(function (it) { it.style.flexBasis = w + 'px'; });
      apply();
    }
    document.addEventListener('wheel', function (e) {
      if (track.scrollWidth - viewport.clientWidth <= 0) return;
      offset += e.deltaY;
      apply();
    }, { passive: true });
    window.addEventListener('resize', layout);
    layout();
  </script>

  <script>
    (function () {
      const root = document.documentElement;
      const btns = document.querySelectorAll('.theme-switch button');
      function sync() {
        const dark = root.classList.contains('dark');
        btns.forEach(function (b) { b.classList.toggle('active', (b.dataset.theme === 'dark') === dark); });
      }
      sync();
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          const dark = b.dataset.theme === 'dark';
          root.classList.toggle('dark', dark);
          try { localStorage.setItem('bvg_theme', dark ? 'dark' : 'light'); } catch (e) {}
          sync();
        });
      });
    })();
  </script>

  <script>
    const ring = document.getElementById('cursor-outer');
    let mx = -100, my = -100;
    let scale = 1, scaleTarget = 1, placed = false;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (!placed) { placed = true; ring.style.opacity = '1'; }
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
    });
    document.addEventListener('mousedown', () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',   () => { scaleTarget = 1; });
    (function loop() {
      scale += (scaleTarget - scale) * 0.2;
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
      requestAnimationFrame(loop);
    })();
  </script>

</body>
</html>
