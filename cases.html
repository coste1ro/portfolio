  <meta property="og:description" content="Кейсы Андрея Берегового: редизайн подписки Rutube, мониторинг аудиторов, панель инсталляций и дизайн-система.">

  <title>Кейсы&nbsp;— Андрей Береговой</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Montserrat:wght@200&family=Roboto+Mono:wght@200&display=swap" rel="stylesheet">
  <script>
    window.__bvgInternal = false;
    (function () {
      var entry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var navType = entry ? entry.type : 'navigate';
      var internal = false;
      try { internal = sessionStorage.getItem('bvg_nav') === '1'; sessionStorage.removeItem('bvg_nav'); } catch (e) {}
      if (internal && navType !== 'reload' && navType !== 'back_forward') {
        window.__bvgInternal = true;
        document.documentElement.classList.add('entering');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    /* Touch devices get the native edge-bounce so a scroll attempt reads
       as "end of page" instead of a frozen screen. Desktop stays a hard-
       locked poster — the bounce fought the horizontal card scrolling
       there. Re-locked during the intro so the slide-up transform can't
       flash a scrollable gap. */
    @media (hover: none) and (pointer: coarse) {
      html, body { overflow: visible; overscroll-behavior: auto; }
      body.preloading,
      html.entering body { overflow: hidden; }
    }

    :root {
      --bg: #ffffff;
      --fg: #000000;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    /* ── Contacts (second row, right — under nav) ── */
    .contacts {
      position: fixed;
      top: 80px;
      right: 40px;
      display: flex;
      gap: 20px;
      z-index: 100;
    }
    .nav-link {
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--fg);
      transition: opacity 0.2s;
    }
    .nav-link::before,
    .nav-link::after {
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .nav-link::before { content: '['; margin-right: 2px; }
    .nav-link::after  { content: ']'; margin-left: 2px; }
    .nav-link:hover::before,
    .nav-link:hover::after { opacity: 1; }

    /* ── Page ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      /* Matches the standardized display-title size used on index.html
         and the case-study slide-titles — was 8.2vw. */
      font-size: 4.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--fg);
      font-kerning: none;
    }

    /* ── Cases track ── */
    .cases-viewport {
      margin-top: auto;
      overflow: hidden;
      padding-top: 100px;
    }
    .cases-track {
      display: flex;
      gap: 40px;
      will-change: transform;
    }

    .case-item {
      flex: 0 0 560px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: transform 0.4s ease;
    }
    .case-item:hover { transform: translateY(-12%); }

    .case-num {
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      color: var(--fg);
      display: block;
      padding-bottom: 40px;
    }

    .case-img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }

    .case-img picture { display: block; width: 100%; height: 100%; }
    .case-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    .case-title {
      font-weight: 300;
      font-size: 20px;
      line-height: 1.2;
      color: var(--fg);
      display: block;
      padding-top: 24px;
    }

    /* ── Preloader ── */
    nav { transition: opacity 0.35s ease; }
    body.preloading nav { opacity: 0; }

    /* ── Internal navigation intro ── */
    .page { transition: opacity 0.35s ease; }
    html.entering .page { opacity: 0; }
    html.no-motion nav,
    html.no-motion .page { transition: none !important; }

    /* ── Mobile: the case grid now shows real, stacked content instead of
       a wheel-pan track (see below) — which means it actually scrolls.
       Nav stays fixed everywhere else on the site, but pinned over
       scrolling content here it'd have cards sliding underneath it, so
       it scrolls away with the page instead, same as about.html. ── */
    @media (max-width: 900px) {
      /* min-height:auto (not 100vh) — same fix as about.html: mobile vh
         units don't reliably match the actually-visible viewport, which
         was the root cause of the slide-in animation jumping mid-flight. */
      /* Narrow windows (incl. a resized desktop, where the base poster
         lock still applies outside the touch-only unlock above) now
         stack taller than the screen — let them scroll instead of
         clipping, same as about.html. */
      html, body { overflow-y: auto; }
      nav { position: static; justify-content: flex-start; padding: 24px 24px 0; }
      .contacts { position: static; justify-content: flex-start; padding: 16px 24px 0; }
      .page { min-height: auto; padding: 40px 24px 24px; }
      .page-title { font-size: 16vw; }

      /* Same cards as desktop, stacked in normal flow instead of the
         wheel-pan horizontal track — the drag-through is a desktop-only
         affordance, but the cases themselves are real content and have
         to actually show here, not hide behind a "open on a computer"
         notice. transform: none !important guards against a stale
         inline transform the desktop JS may have set before a resize
         into this breakpoint (e.g. a rotated tablet). */
      .cases-viewport { margin-top: 40px; padding-top: 0; overflow: visible; }
      .cases-track { flex-direction: column; gap: 60px; transform: none !important; }
      .case-item { flex: none; width: 100%; }
      .case-item:hover { transform: none; }
      /* Match the num→photo gap to the photo→title gap (both 24px) —
         desktop's 40px num→photo gap felt uneven stacked on mobile. */
      .case-num { padding-bottom: 24px; }
    }

    #preload {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9000;
      overflow: hidden;
      transition: background 0.6s ease;
    }
    #preload-count {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Roboto Mono', monospace;
      font-weight: 200;
      font-size: 24px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #preload-title {
      position: absolute;
      left: 40px; bottom: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      /* Matches .page-title (was 8.2vw — never updated when the real
         title was standardized down to 4.2vw, so the clone showed at
         roughly double the real title's size on desktop). */
      font-size: 4.2vw;
      letter-spacing: 0.03em;
      line-height: 0.9;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--fg);
      transform: translateY(50%);
      font-kerning: none;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }
    /* Placed after #preload-title on purpose — the main mobile media
       query above comes earlier in the file, so an override placed
       there would lose to this unconditional rule (same specificity,
       later source order wins) and silently not apply. Same bug this
       had on index.html. */
    @media (max-width: 900px) {
      #preload-title { font-size: 16vw; left: 24px; }
    }

    /* ── Cursor ── */
    * { cursor: none !important; }

    @media (hover: none) and (pointer: coarse) {
      #cursor-outer, #cursor-dot { display: none !important; }
      * { cursor: auto !important; }
    }

    #cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      pointer-events: none;
      z-index: 99999;
      will-change: transform;
      mix-blend-mode: difference;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

  <div id="preload">

    <span id="preload-count">000</span>
  </div>

  <nav>

  </div>

  <main class="page">
    <h1 class="page-title">Кейсы</h1>

          <span class="case-num">[2]</span>
          <div class="case-img">
            <picture>
              <source srcset="projects/auditors_monitoring.webp" type="image/webp">
              <img src="projects/auditors_monitoring.png" alt="Мониторинг аудиторов" loading="eager" decoding="async">
            </picture>

        <a href="installation_panel.html" class="case-item">
          <span class="case-num">[3]</span>
          <div class="case-img">
            <picture>
              <source srcset="projects/installation_panel.webp" type="image/webp">

          <div class="case-img">

  <div id="cursor-outer"></div>

  <script>
    (function () {
      const preload   = document.getElementById('preload');
      const countEl   = document.getElementById('preload-count');
      const titleEl   = document.getElementById('preload-title');
      const realTitle = document.querySelector('.page-title');
      const navEl     = document.querySelector('nav');
      const pageEl    = document.querySelector('.page');
      const reduce    = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Internal nav between INDEX — CASES — ABOUT dissolves the current
      // screen out; the destination page plays a fast version of the entry
      // intro (title slides up into place, no counter). The full intro with
      // counter only plays on a real entry (external link or reload).
      function currentFile() {
        const p = location.pathname.split('/').pop();
        return (p === '' ? 'index.html' : p).replace(/\.html$/, '');
      }
      let navBusy = false;
      (function bindNavTransition() {
        const here = currentFile();
        const mainEl = document.querySelector('.page');
        document.querySelectorAll('nav a').forEach(function (a) {
          if (a.hasAttribute('download')) return;
          const href = a.getAttribute('href');
          if (href.replace(/\.html$/, '') === here) {
            a.addEventListener('click', function (e) { e.preventDefault(); });
            return;
          }
          a.addEventListener('click', function (e) {
            e.preventDefault();
            if (navBusy) return;
            navBusy = true;
            try { sessionStorage.setItem('bvg_nav', '1'); } catch (err) {}
            if (reduce) { window.location.href = href; return; }
            // Only the page content fades — nav stays put throughout the
            // whole transition.
            mainEl.style.transition = 'opacity 0.35s ease';
            mainEl.style.opacity = '0';
            setTimeout(function () { window.location.href = href; }, 350);
          });
        });
      })();

      function clearEnterState() {
        const html = document.documentElement;
        if (!html.classList.contains('entering')) return;
        html.classList.add('no-motion');
        html.classList.remove('entering');
      }

      function shouldPreload() {
        return !window.__bvgInternal;
      }

      const canShow = shouldPreload();

      if (reduce) {
        preload.remove();
        clearEnterState();
        return;
      }

      document.body.classList.add('preloading');

      // Slides the whole page — title and content together, as one rigid
      // block — from a half-visible-at-bottom start up into its natural
      // resting position. Since the content sits inside .page, it can never
      // drift out of sync with the title or visually collide with it: it's
      // the exact same transform, not two separately-animated pieces.
      function slidePageIn() {
        const r = realTitle.getBoundingClientRect();
        const startY = window.innerHeight - (r.top + r.height / 2);
        pageEl.style.transition = 'none';
        pageEl.style.transform = 'translateY(' + startY + 'px)';
        void pageEl.offsetHeight; // commit the instant position before animating away from it

        preload.style.background = 'transparent';
        preload.style.pointerEvents = 'none';
        navEl.style.opacity = '1';
        document.documentElement.classList.remove('entering');

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            pageEl.style.transition = 'transform 1s cubic-bezier(0.76,0,0.24,1)';
            pageEl.style.transform = 'translateY(0)';
          });
        });

        setTimeout(function () {
          document.body.classList.remove('preloading');
          preload.remove();
          // Drop the transform once settled — leaving it (even at an
          // identity translateY(0)) makes .page a containing block for any
          // position:fixed descendant, pinning it to .page's box instead
          // of the true viewport.
          pageEl.style.transform = '';
        }, 1000);
      }

      if (!canShow) {
        // Internal nav: nav never hides, it's shown right away. No counter,
        // no clone — just slide the real page into place, so there's
        // motion on screen from the first frame instead of a blank gap
        // before the page appears.
        slidePageIn();
        return;
      }

      // Full entry: counter + clone letter-reveal (masked by #preload's
      // opaque background), then hand off to the same slide as fast-intro.
      function finish() {
        countEl.style.opacity = '0';
        setTimeout(function () {
          titleEl.style.opacity = '0';
          slidePageIn();
        }, 300);
      }

      function run() {
        countEl.style.opacity = '1';
        const DURATION = 2200;
        const start = performance.now();
        let titleShown = false;
        (function frame(now) {
          const t = Math.min((now - start) / DURATION, 1);
          countEl.textContent = String(Math.round(t * 100)).padStart(3, '0');
          if (t >= 0.5 && !titleShown) {
            titleShown = true;
            titleEl.style.clipPath = 'inset(0 0% 0 0)';
          }
          if (t < 1) requestAnimationFrame(frame);
          else finish();
        })(start);
      }

      if (document.fonts && document.fonts.ready) {
        Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(run);
      } else {
        run();
      }
    })();
  </script>

  <script>
    const viewport = document.querySelector('.cases-viewport');
    const track = document.querySelector('.cases-track');
    const items = Array.from(track.children);
    const GAP = 40, VISIBLE = 2.3;   // 2 full cases + ~30% of the third peeking
    let offset = 0;

    function apply() {
      const max = Math.max(0, track.scrollWidth - viewport.clientWidth);
      offset = Math.max(0, Math.min(offset, max));
      track.style.transform = 'translateX(' + (-offset) + 'px)';
    }
    function layout() {
      // Mobile stacks the cards in a plain column via CSS (transform:
      // none !important) instead of the desktop wheel-pan track — skip
      // the pixel flex-basis math entirely there so this can't fight
      // that layout or force a pointless read/write mid-entrance-animation.
      if (!viewport.clientWidth || document.documentElement.clientWidth <= 900) return;
      const w = (viewport.clientWidth - GAP * 2) / VISIBLE;
      items.forEach(function (it) { it.style.flexBasis = w + 'px'; });
      apply();
    }
    document.addEventListener('wheel', function (e) {
      if (track.scrollWidth - viewport.clientWidth <= 0) return;
      // deltaX too — a natural two-finger horizontal swipe on a trackpad
      // (the intuitive gesture for horizontally-laid-out cards) only ever
      // reported on deltaX, and was silently dropped before.
      offset += e.deltaX + e.deltaY;
      apply();
    }, { passive: true });
    window.addEventListener('resize', layout);
    layout();
  </script>

  <script>
    const ring = document.getElementById('cursor-outer');
    let mx = -100, my = -100;
    let scale = 1, scaleTarget = 1, placed = false;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (!placed) { placed = true; ring.style.opacity = '1'; }
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
    });
    document.addEventListener('mousedown', () => { scaleTarget = 0.6; });
    document.addEventListener('mouseup',   () => { scaleTarget = 1; });
    (function loop() {
      scale += (scaleTarget - scale) * 0.2;
      ring.style.transform = 'translate3d(' + (mx - 12) + 'px,' + (my - 12) + 'px,0) scale(' + scale.toFixed(3) + ')';
      requestAnimationFrame(loop);
    })();
  </script>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
